<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true">
<!-- Hold On piece set: twelve flat silhouettes, each one closed path in a 100x100 box on a shared
     64-unit base (x 18..82, 8 high), 6-unit strokes for every cut, notch, arm and merlon gap.
     Fills come from the page's --piece-white / --piece-black tokens (edges from the -edge tokens);
     the stroke is in screen pixels (non-scaling), 1.5 px on white, 1 px on black. -->
